services:
  homelab-hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    ports:
      - "5000:3000"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/intranet.db
      - LOCAL_SUFFIXES=${LOCAL_SUFFIXES:-.lan,.home.arpa,.local,.internal}
      - VPN_RANGES=${VPN_RANGES:-100.64.0.0/10}
      - MERCUSYS_URL=${MERCUSYS_URL:-}
      - MERCUSYS_PASSWORD=${MERCUSYS_PASSWORD:-}
    # Per scan ARP/OS detection avanzati (opzionale sul Pi):
    # cap_add: [NET_ADMIN, NET_RAW]
    # network_mode: host
    restart: unless-stopped